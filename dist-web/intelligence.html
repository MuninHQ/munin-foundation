<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Munin Intelligence</title>
    <link rel="stylesheet" href="/munin.css" />
    <style>
      .shell {
        display: grid;
        grid-template-columns: 230px 1fr;
        min-height: 100vh;
      }
      .side {
        padding: 28px 20px;
        border-right: 1px solid #172738;
        background: #07111c;
      }
      .brand {
        letter-spacing: 0.22em;
        font-weight: 700;
      }
      .sub {
        color: #668097;
        font-size: 12px;
        margin-top: 6px;
      }
      .side a,
      .side button {
        display: block;
        width: 100%;
        margin-top: 14px;
        padding: 12px 14px;
        border: 1px solid #1d3448;
        border-radius: 9px;
        background: #0a1724;
        color: #b8d3e6;
        text-decoration: none;
        text-align: left;
        cursor: pointer;
      }
      .side button.active {
        border-color: #2b89c5;
        color: white;
        background: #102539;
      }
      .main {
        padding: 34px;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: end;
        border-bottom: 1px solid #172738;
        padding-bottom: 22px;
      }
      .top h1 {
        margin: 5px 0 0;
        font-size: 30px;
      }
      .status {
        color: #6fe0a4;
        font-size: 12px;
      }
      .hero {
        margin-top: 22px;
        border: 1px solid #1a3851;
        border-radius: 16px;
        background: linear-gradient(110deg, #0a1724, #0c2539);
        padding: 28px;
      }
      .hero h2 {
        margin: 5px 0 10px;
      }
      .hero p {
        color: #8ca4b7;
      }
      .grid {
        display: grid;
        grid-template-columns: 1.3fr 1fr;
        gap: 16px;
        margin-top: 16px;
      }
      .panel {
        border: 1px solid #182d40;
        background: #08131e;
        border-radius: 13px;
        padding: 20px;
      }
      .panel h3 {
        margin: 4px 0 14px;
      }
      .list {
        display: grid;
        gap: 10px;
      }
      .item {
        border-top: 1px solid #142536;
        padding: 12px 0;
      }
      .item:first-child {
        border-top: 0;
      }
      .item strong {
        display: block;
      }
      .item small {
        color: #668097;
      }
      .severity {
        display: inline-block;
        font-size: 9px;
        padding: 4px 7px;
        border-radius: 999px;
        margin-bottom: 7px;
      }
      .critical {
        color: #ffaaa3;
        background: #4d211f;
      }
      .attention {
        color: #f0d38b;
        background: #453a1b;
      }
      .info {
        color: #91d8ff;
        background: #0d3148;
      }
      .timeline {
        max-height: 540px;
        overflow: auto;
      }
      .time-row {
        display: grid;
        grid-template-columns: 115px 1fr;
        gap: 14px;
        padding: 11px 0;
        border-top: 1px solid #142536;
      }
      .time-row:first-child {
        border-top: 0;
      }
      .time-row time {
        color: #668097;
        font-size: 11px;
      }
      .graph {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        max-height: 540px;
        overflow: auto;
      }
      .node {
        padding: 12px;
        border: 1px solid #24445d;
        border-radius: 9px;
        background: #0b1c2a;
      }
      .node small {
        color: #5f7c94;
      }
      .brief ul {
        padding-left: 18px;
      }
      .brief li {
        margin: 8px 0;
        color: #b9cbd8;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }
      .toolbar button {
        border: 1px solid #24445e;
        background: #0d1b29;
        color: #c5d9e7;
        border-radius: 8px;
        padding: 10px 13px;
        cursor: pointer;
      }
      .empty {
        color: #688096;
      }
      .error {
        border: 1px solid #7e3434;
        background: #2b1212;
        padding: 14px;
        border-radius: 10px;
        color: #ffc0ba;
      }
      @media (max-width: 1000px) {
        .shell {
          grid-template-columns: 1fr;
        }
        .side {
          display: none;
        }
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <script defer src="/munin-nav.js"></script>
  </head>
  <body>
    <div class="shell">
      <aside class="side">
        <div class="brand">MUNIN</div>
        <div class="sub">Personal Intelligence</div>
        <button class="active" data-view="overview">Overview</button
        ><button data-view="timeline">Timeline</button><button data-view="graph">Knowledge Graph</button
        ><a href="/">← Workspace principal</a>
      </aside>
      <main class="main">
        <header class="top">
          <div>
            <div class="eyebrow">M11.3 INTELLIGENCE WORKSPACE</div>
            <h1 id="title">Visão de Inteligência</h1>
          </div>
          <div class="status" id="status">● conectando</div>
        </header>
        <div id="root"></div>
      </main>
    </div>
    <script>
      const state = { data: null, view: "overview" };
      const esc = (v) =>
        String(v ?? "").replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      async function load() {
        try {
          const r = await fetch("/api/workspace");
          if (!r.ok) throw new Error("Falha ao carregar workspace");
          state.data = await r.json();
          document.querySelector("#status").textContent = "● dados ao vivo";
          render();
        } catch (e) {
          document.querySelector("#status").textContent = "● desconectado";
          document.querySelector("#root").innerHTML = '<p class="error">' + esc(e.message) + "</p>";
        }
      }
      function insight(i) {
        return (
          '<div class="item"><span class="severity ' +
          esc(i.severity) +
          '">' +
          esc(i.severity) +
          "</span><strong>" +
          esc(i.title) +
          "</strong><small>" +
          esc(i.rationale) +
          "</small><p>" +
          esc(i.action) +
          "</p></div>"
        );
      }
      function overview() {
        const x = state.data.intelligence || {};
        const b = x.dailyBrief || {};
        const ins = x.insights || [];
        return (
          '<section class="hero"><div class="eyebrow">DAILY BRIEF</div><h2>' +
          esc(b.headline || "Nenhum briefing disponível") +
          "</h2><p>" +
          esc((b.insights || [])[0] || "O Munin está analisando seu workspace.") +
          '</p><div class="toolbar"><button onclick="state.view=\'timeline\';render()">Abrir timeline</button><button onclick="state.view=\'graph\';render()">Explorar grafo</button></div></section><section class="grid"><article class="panel brief"><div class="eyebrow">PRIORIDADES</div><h3>Hoje</h3><ul>' +
          ((b.priorities || []).map((v) => "<li>" + esc(v) + "</li>").join("") ||
            '<li class="empty">Sem prioridades críticas.</li>') +
          '</ul><div class="eyebrow">ALERTAS</div><ul>' +
          ((b.alerts || []).map((v) => "<li>" + esc(v) + "</li>").join("") ||
            '<li class="empty">Nenhum alerta.</li>') +
          '</ul></article><article class="panel"><div class="eyebrow">INSIGHT ENGINE</div><h3>Recomendações</h3><div class="list">' +
          (ins.slice(0, 8).map(insight).join("") || '<p class="empty">Nenhuma recomendação no momento.</p>') +
          "</div></article></section>"
        );
      }
      function timeline() {
        const items = state.data.intelligence?.timeline || [];
        return (
          '<section class="panel timeline" style="margin-top:22px"><div class="eyebrow">MEMÓRIA OPERACIONAL</div><h3>Timeline unificada</h3>' +
          items
            .map(
              (i) =>
                '<div class="time-row"><time>' +
                esc(new Date(i.timestamp).toLocaleString("pt-BR")) +
                "</time><div><strong>" +
                esc(i.title) +
                "</strong><small>" +
                esc(i.kind) +
                " · " +
                esc(i.entityType) +
                "</small></div></div>",
            )
            .join("") +
          "</section>"
        );
      }
      function graph() {
        const g = state.data.intelligence?.graph || { nodes: [], edges: [] };
        return (
          '<section class="grid"><article class="panel" style="margin-top:22px"><div class="eyebrow">KNOWLEDGE GRAPH</div><h3>Entidades</h3><div class="graph">' +
          g.nodes
            .map(
              (n) =>
                '<div class="node"><strong>' +
                esc(n.label) +
                "</strong><small>" +
                esc(n.type) +
                "</small></div>",
            )
            .join("") +
          '</div></article><article class="panel" style="margin-top:22px"><div class="eyebrow">CONEXÕES</div><h3>Relações</h3><div class="list">' +
          g.edges
            .slice(0, 80)
            .map(
              (e) =>
                '<div class="item"><strong>' +
                esc(e.source) +
                " → " +
                esc(e.target) +
                "</strong><small>" +
                esc(e.type) +
                (e.inferred ? " · inferida" : " · explícita") +
                "</small></div>",
            )
            .join("") +
          "</div></article></section>"
        );
      }
      function render() {
        document
          .querySelectorAll("[data-view]")
          .forEach((b) => b.classList.toggle("active", b.dataset.view === state.view));
        document.querySelector("#title").textContent =
          state.view === "timeline"
            ? "Timeline"
            : state.view === "graph"
              ? "Knowledge Graph"
              : "Visão de Inteligência";
        document.querySelector("#root").innerHTML =
          state.view === "timeline" ? timeline() : state.view === "graph" ? graph() : overview();
      }
      document.querySelectorAll("[data-view]").forEach((b) =>
        b.addEventListener("click", () => {
          state.view = b.dataset.view;
          render();
        }),
      );
      load();
    </script>
  </body>
</html>
