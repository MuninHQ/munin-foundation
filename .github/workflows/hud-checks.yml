name: HUD checks

on:
  pull_request:
    paths:
      - 'apps/web/hud.html'
      - 'apps/web/public/hud.js'
      - 'apps/web/public/hud.css'
      - 'apps/web/public/munin-client.js'
      - 'apps/web/vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/hud-checks.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/hud.html'
      - 'apps/web/public/hud.js'
      - 'apps/web/public/hud.css'
      - 'apps/web/public/munin-client.js'
      - 'apps/web/vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/hud-checks.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check static browser JavaScript syntax
        run: |
          node --check apps/web/public/hud.js
          node --check apps/web/public/munin-client.js
      - name: Build web application
        run: npm run build:web
