name: Munin CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/munin-ci.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build core
        run: npm run build:core
      - name: Build web
        run: npm run build:web
      - name: Run tests
        run: node --test --test-reporter=spec dist/tests/*.test.js
