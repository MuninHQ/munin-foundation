<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Munin Intelligence</title><link rel="stylesheet" href="/munin.css"/><script defer src="/munin-nav.js"></script><style>.shell{max-width:1280px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.panel{border:1px solid #193149;background:#08131f;border-radius:14px;padding:20px}.rows{display:grid;gap:10px}.row{padding:10px 0;border-top:1px solid #173047}.row:first-child{border-top:0}.muted{color:var(--text-muted)}button,a.btn{border:1px solid #28506c;background:#0d1d2b;color:#d8ecfa;border-radius:9px;padding:10px 13px;text-decoration:none;cursor:pointer}@media(max-width:800px){.grid{grid-template-columns:1fr}.top{flex-direction:column}.shell{padding:18px}}</style></head><body><main class="shell"><div class="top"><div><div class="eyebrow">MUNIN INTELLIGENCE</div><h1>Intelligence</h1><p>Sinais, insights, timeline e contexto pesquisável do workspace.</p></div><a class="btn" href="/">← Command Center</a></div><section class="grid"><article class="panel"><div class="eyebrow">DAILY BRIEF</div><div id="brief">Carregando…</div></article><article class="panel"><div class="eyebrow">INSIGHTS</div><div id="insights" class="rows"></div></article><article class="panel"><div class="eyebrow">TIMELINE</div><div id="timeline" class="rows"></div></article><article class="panel"><div class="eyebrow">CONTEXT SEARCH</div><input id="q" placeholder="Buscar contexto" style="width:100%;box-sizing:border-box;padding:11px;border-radius:9px;border:1px solid #28506c;background:#07131e;color:#d8ecfa"/><button id="search" style="margin-top:10px">Buscar</button><div id="context" class="rows" style="margin-top:12px"></div></article></section></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function get(p){const r=await fetch(p),d=await r.json();if(!r.ok)throw new Error(d.error||'Falha');return d}function row(title,body){return `<div class="row"><strong>${esc(title)}</strong>${body?`<div class="muted">${esc(body)}</div>`:''}</div>`}async function load(){try{const[brief,insights,timeline]=await Promise.all([get('/api/intelligence/daily-brief'),get('/api/intelligence/insights'),get('/api/intelligence/timeline?limit=20')]);document.getElementById('brief').innerHTML=`<pre style="white-space:pre-wrap">${esc(typeof brief==='string'?brief:JSON.stringify(brief,null,2))}</pre>`;document.getElementById('insights').innerHTML=(insights.items||[]).slice(0,12).map((x,i)=>row(x.title||x.type||`Insight ${i+1}`,x.summary||x.message||JSON.stringify(x))).join('')||'<p class="muted">Sem insights no momento.</p>';document.getElementById('timeline').innerHTML=(timeline.items||[]).slice(0,20).map((x,i)=>row(x.title||x.type||x.event||`Evento ${i+1}`,x.summary||x.detail||x.at||JSON.stringify(x))).join('')||'<p class="muted">Sem eventos recentes.</p>'}catch(e){document.getElementById('brief').textContent=e.message}}document.getElementById('search').onclick=async()=>{const q=document.getElementById('q').value.trim();if(!q)return;try{const d=await get('/api/intelligence/context?q='+encodeURIComponent(q));document.getElementById('context').innerHTML=(d.matches||[]).map((x,i)=>row(x.section?.key||x.key||`Match ${i+1}`,JSON.stringify(x.section?.value??x.value??x))).join('')||'<p class="muted">Nada encontrado.</p>'}catch(e){document.getElementById('context').textContent=e.message}};load();</script></body></html>
