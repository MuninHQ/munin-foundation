<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Munin · Manus Operator</title><link rel="stylesheet" href="/munin.css"><script defer src="/munin-nav.js"></script><style>
.shell{max-width:1100px;margin:auto;padding:28px 20px 90px}.top,.row{display:flex;justify-content:space-between;gap:14px;align-items:center}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:15px}.panel{border:1px solid var(--border);background:var(--panel);border-radius:14px;padding:18px}label{display:grid;gap:6px;margin:12px 0;color:#9bb4c4;font-size:12px}input,textarea,select{width:100%;border:1px solid #28506c;background:#07131e;color:#e3f3fb;border-radius:9px;padding:10px}textarea{min-height:180px;resize:vertical}button{border:1px solid #28506c;background:#0d2635;color:#d9f2ff;border-radius:9px;padding:10px 13px}.task{border-top:1px solid #173047;padding:13px 0}.task h3{font-size:15px;margin:4px 0}.tag{border:1px solid #28506c;border-radius:999px;padding:3px 7px;font-size:10px}.waiting,.failed{color:#ffad9f}.completed{color:#68dba5}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="shell"><section class="top"><div><p class="eyebrow">GOVERNED EXTERNAL OPERATOR</p><h1>Manus Operator</h1><p class="muted">Delegação operacional limitada por tipo, orçamento e aprovação humana.</p></div><button onclick="refresh()">Atualizar retornos</button></section><section class="grid"><form class="panel" onsubmit="submitTask(event)"><p class="eyebrow">NOVA TAREFA</p><div id="status" class="muted">Carregando status…</div><label>Tipo<select id="kind"><option value="research">Pesquisa</option><option value="analysis">Análise</option><option value="content-draft">Rascunho</option><option value="repository-diagnostics">Diagnóstico do repositório</option></select></label><label>Título<input id="title" required maxlength="160"></label><label>Instrução<textarea id="prompt" required maxlength="12000"></textarea></label><label>Reserva máxima de créditos<input id="budget" type="number" min="10" max="1000" value="150"></label><button id="send">Delegar ao Manus</button></form><article class="panel"><p class="eyebrow">EXECUÇÕES</p><div id="tasks">Carregando…</div></article></section></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,options){const r=await fetch(path,{headers:{'content-type':'application/json'},...options}),d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}async function load(){try{const[s,t]=await Promise.all([api('/api/manus/status'),api('/api/manus/tasks')]);status.textContent=s.enabled?`ATIVO · ${s.profile} · ${s.declaredCreditsToday}/${s.dailyCreditBudget} créditos reservados hoje · ${s.submittedToday}/${s.maxTasksPerDay} tarefas`:`INATIVO · ${s.reason}`;tasks.innerHTML=t.items.slice().reverse().map(x=>`<div class="task"><div class="row"><span class="tag ${esc(x.status)}">${esc(x.status)}</span><small class="muted">${x.creditUsage??'—'} créditos usados</small></div><h3>${esc(x.title)}</h3><div class="muted">${esc(x.waitingDescription||x.error||x.result?.slice(0,600)||x.kind)}</div>${x.taskUrl?`<a target="_blank" rel="noreferrer" href="${esc(x.taskUrl)}">Abrir no Manus</a>`:''}</div>`).join('')||'<p class="muted">Nenhuma tarefa delegada.</p>'}catch(e){status.textContent=e.message}}async function submitTask(e){e.preventDefault();send.disabled=true;try{await api('/api/manus/tasks',{method:'POST',body:JSON.stringify({kind:kind.value,title:title.value,prompt:prompt.value,declaredCreditBudget:Number(budget.value)})});title.value='';prompt.value='';await load()}catch(e){status.textContent=e.message}finally{send.disabled=false}}async function refresh(){try{await api('/api/manus/refresh',{method:'POST'});await load()}catch(e){status.textContent=e.message}}load();
</script></body></html>
