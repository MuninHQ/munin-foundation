<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#05080d"><title>Munin · Action Inbox</title><link rel="stylesheet" href="/munin.css"><script defer src="/munin-client.js"></script><script defer src="/munin-nav.js"></script><style>
.summary{display:grid;grid-template-columns:1.25fr repeat(3,.55fr);gap:10px}.summary article,.decision{border:1px solid var(--border);background:linear-gradient(160deg,var(--surface-raised),var(--surface));border-radius:14px;padding:17px}.summary strong{display:block;font-size:28px;margin-top:5px}.filters{display:flex;gap:7px;overflow:auto;margin:18px 0 12px}.filters button,.ghost,.primary{border:1px solid var(--border-strong);border-radius:9px;padding:9px 11px;background:transparent;color:var(--text-soft);white-space:nowrap;cursor:pointer}.filters button.active,.primary{background:var(--accent-strong);border-color:var(--accent-border);color:white}.list{display:grid;gap:10px}.decision{display:grid;grid-template-columns:1fr auto;gap:18px}.decision h2{font-size:16px;margin:8px 0 6px}.decision p{color:var(--text-muted);font-size:12px;line-height:1.5;margin:0}.why{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:13px}.why div{background:var(--surface-input);border-radius:9px;padding:10px}.why b{display:block;color:var(--text-faint);font-size:9px;letter-spacing:.1em;margin-bottom:4px}.why span{color:var(--text-soft);font-size:11px}.decision-actions{display:flex;align-items:flex-start;gap:6px}.decision-actions a{text-decoration:none}.timeline{display:flex;gap:4px;margin-top:13px}.timeline span{flex:1;color:var(--text-faint);font-size:9px;border-top:2px solid var(--border-strong);padding-top:6px}.timeline span.on{color:var(--ok);border-color:var(--ok)}.empty{text-align:center;padding:38px}.empty strong{font-size:16px}.refresh[aria-busy=true]{opacity:.65}@media(max-width:760px){.summary{display:flex;overflow:auto;margin:0 -16px;padding:0 16px}.summary article{min-width:140px}.summary .lead{min-width:220px}.decision{grid-template-columns:1fr}.why{grid-template-columns:1fr}.decision-actions{overflow:auto}.decision-actions>*{flex:1;text-align:center}.timeline{overflow:hidden}}
</style></head><body><main class="munin-page"><header class="munin-page-header"><div class="munin-page-copy"><p class="eyebrow">CENTRAL DE DECISÕES</p><h1>Action Inbox</h1><p>Entenda o que aconteceu, por que importa e decida sem perder contexto.</p></div><button id="refresh" class="primary refresh">Atualizar</button></header><section id="summary" class="summary"><article class="lead munin-skeleton">Carregando prioridades…</article><article class="munin-skeleton"></article><article class="munin-skeleton"></article><article class="munin-skeleton"></article></section><nav id="filters" class="filters" aria-label="Filtrar decisões"></nav><section id="list" class="list" aria-live="polite"><article class="munin-state munin-skeleton">Organizando sua fila…</article></section></main><script>
const labels={all:'Tudo',now:'Agora',review:'Revisar',executing:'Executando',done:'Concluído',radar:'Radar'};let snapshot;let lane='all';const el=id=>document.getElementById(id);const e=v=>Munin.escapeHtml(v);const status=x=>x.lane==='done'?'ok':x.priority==='P0'?'attention':x.lane==='executing'?'waiting':'waiting';function recommendation(x){if(x.action)return x.action.label;if(x.lane==='done')return'Consultar recibo';if(x.lane==='executing')return'Acompanhar execução';return'Revisar contexto'}function consequence(x){if(x.origin==='email'||x.origin==='career')return'Evita perder prazo ou retorno importante.';if(x.origin==='radar')return'Mantém a decisão baseada em fonte confiável.';if(x.origin==='manus')return'Libera ou interrompe a próxima etapa operacional.';return'Mantém prioridades e histórico atualizados.'}function draw(){const items=snapshot.items.filter(x=>lane==='all'||x.lane===lane);el('summary').innerHTML=`<article class="lead"><span class="eyebrow">PRECISAM DE VOCÊ</span><strong>${snapshot.counts.now+snapshot.counts.review}</strong><small>decisões abertas</small></article>${[['P0',snapshot.items.filter(x=>x.priority==='P0'&&x.lane!=='done').length],['Executando',snapshot.counts.executing],['Concluídos',snapshot.counts.done]].map(x=>`<article><span class="eyebrow">${e(x[0])}</span><strong>${x[1]}</strong></article>`).join('')}`;el('filters').innerHTML=Object.entries(labels).map(([k,v])=>`<button class="${lane===k?'active':''}" data-lane="${k}">${e(v)} ${k==='all'?snapshot.items.length:snapshot.counts[k]}</button>`).join('');el('filters').querySelectorAll('button').forEach(b=>b.onclick=()=>{lane=b.dataset.lane;draw()});el('list').innerHTML=items.length?items.map(x=>`<article class="decision"><div><span class="munin-status munin-status-${status(x)}">${e(x.priority)} · ${e(labels[x.lane])}</span><h2>${e(x.title)}</h2><p>${e(x.detail||'O Munin identificou este item no workspace.')}</p><div class="why"><div><b>POR QUE IMPORTA</b><span>${e(x.detail||'Existe uma pendência relacionada.')}</span></div><div><b>RECOMENDAÇÃO</b><span>${e(recommendation(x))}</span></div><div><b>IMPACTO</b><span>${e(consequence(x))}</span></div></div>${['executing','done'].includes(x.lane)?`<div class="timeline"><span class="on">Recebido</span><span class="on">Validado</span><span class="${x.lane==='done'?'on':''}">Executado</span><span class="${x.lane==='done'?'on':''}">Concluído</span></div>`:''}</div><div class="decision-actions">${x.action?`<a class="primary" href="${e(x.action.href)}" ${x.action.href.startsWith('http')?'target="_blank" rel="noreferrer"':''}>${e(x.action.label)}</a>`:''}<button class="ghost" onclick="deferItem(this)">Adiar</button><button class="ghost" onclick="dismissItem(this)">Descartar</button></div></article>`).join(''):`<article class="munin-state empty"><strong>Nada pendente aqui</strong><span>O Munin avisará quando surgir uma decisão.</span></article>`}function deferItem(button){button.closest('.decision').remove();Munin.toast('Item adiado nesta visualização.','warn')}function dismissItem(button){button.closest('.decision').remove();Munin.toast('Item removido desta visualização.')}async function load(){Munin.setBusy(el('refresh'),true,'Atualizando…');el('list').innerHTML='<article class="munin-state munin-skeleton">Atualizando a fila…</article>';try{snapshot=await Munin.request('/api/action-inbox');draw();Munin.toast('Action Inbox atualizada.')}catch(error){el('list').innerHTML=`<article class="munin-state empty"><strong>Não foi possível carregar</strong><span>${e(error.message)}</span><button class="ghost" onclick="load()">Tentar novamente</button></article>`}finally{Munin.setBusy(el('refresh'),false)}}el('refresh').onclick=load;load();
</script></body></html>
