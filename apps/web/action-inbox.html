<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Munin · Action Inbox</title><link rel="stylesheet" href="/munin.css"><script defer src="/munin-nav.js"></script><style>
.shell{max-width:1200px;margin:auto;padding:28px 20px 90px}.top,.lane-head,.item{display:flex;justify-content:space-between;gap:14px;align-items:center}.top{align-items:flex-start;margin-bottom:24px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.metric,.lane{border:1px solid var(--border);background:var(--panel);border-radius:14px}.metric{padding:16px}.metric strong{font-size:28px;display:block}.board{display:grid;gap:14px;margin-top:18px}.lane{padding:18px}.lane h2{margin:0;font-size:18px}.count,.tag{border:1px solid #28506c;border-radius:999px;padding:4px 8px;font-size:11px;color:#9bd7f8}.item{border-top:1px solid #173047;padding:14px 0}.item:first-of-type{margin-top:10px}.item h3{font-size:15px;margin:0 0 4px}.item p{margin:0}.item a{white-space:nowrap;text-decoration:none;border:1px solid #28506c;border-radius:8px;padding:8px 10px}.empty{color:var(--text-muted);padding:14px 0}.refresh{border:1px solid #28506c;background:#0d1d2b;color:#d8ecfa;border-radius:9px;padding:10px 13px}@media(max-width:720px){.metrics{grid-template-columns:repeat(2,1fr)}.top{flex-direction:column}.item{align-items:flex-start}.item a{margin-top:5px}}
</style></head><body><main class="shell"><section class="top"><div><p class="eyebrow">MUNIN OPERATOR</p><h1>Action Inbox</h1><p class="muted">Uma fila única para o que precisa de você, o que está executando e o que o Radar encontrou.</p></div><button class="refresh" onclick="load()">Atualizar</button></section><section id="metrics" class="metrics"></section><section id="board" class="board"><div class="lane">Carregando…</div></section></main><script>
const labels={now:'Agora',review:'Revisar',executing:'Executando',done:'Concluído',radar:'Radar'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const board=document.getElementById('board');try{const r=await fetch('/api/action-inbox'),d=await r.json();if(!r.ok)throw new Error(d.error||'Falha');metrics.innerHTML=Object.entries(labels).map(([k,v])=>`<article class="metric"><span class="eyebrow">${esc(v)}</span><strong>${d.counts[k]}</strong></article>`).join('');board.innerHTML=Object.entries(labels).map(([lane,label])=>{const items=d.items.filter(x=>x.lane===lane);return `<article class="lane"><div class="lane-head"><h2>${esc(label)}</h2><span class="count">${items.length}</span></div>${items.length?items.map(x=>`<div class="item"><div><span class="tag">${esc(x.priority)} · ${esc(x.origin)}</span><h3>${esc(x.title)}</h3><p class="muted">${esc(x.detail||'')}</p></div>${x.action?`<a href="${esc(x.action.href)}" ${x.action.href.startsWith('http')?'target="_blank" rel="noreferrer"':''}>${esc(x.action.label)}</a>`:''}</div>`).join(''):'<div class="empty">Nada nesta fila.</div>'}</article>`}).join('')}catch(e){board.innerHTML=`<article class="lane">${esc(e.message)}</article>`}}load();
</script></body></html>
