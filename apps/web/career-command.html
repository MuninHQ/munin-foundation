<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Munin Career Command</title>
  <link rel="stylesheet" href="/munin.css"/>
  <style>
    .shell{max-width:1400px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center}.top-actions{display:flex;gap:10px;flex-wrap:wrap}.metrics,.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.grid{grid-template-columns:1.2fr 1fr}.panel,.metric{border:1px solid #193149;background:#08131f;border-radius:14px;padding:20px}.metric strong{font-size:30px;display:block;margin-top:8px}.rows{display:grid;gap:10px}.row{border-top:1px solid #173047;padding:12px 0}.row:first-child{border-top:0}.row strong{display:block}.row small{color:var(--text-muted)}button,a.btn{border:1px solid #28506c;background:#0d1d2b;color:#d8ecfa;border-radius:9px;padding:10px 13px;text-decoration:none;cursor:pointer}.accent{color:#72c6f5}.ok{color:#8adcb0}.auth-note{margin-top:12px;padding:12px;border:1px solid #28506c;border-radius:10px;background:#0a1926}.auth-note p{margin:0 0 10px;color:var(--text-muted)}@media(max-width:850px){.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{align-items:flex-start;gap:12px;flex-direction:column}}
  </style>
  <script defer src="/munin-nav.js"></script>
</head>
<body>
<main class="shell">
  <div class="top">
    <div><div class="eyebrow">CAREER INTELLIGENCE V2</div><h1>Career Command</h1><p>Processos seletivos reconstruídos, prioridades e preparação em um único painel.</p></div>
    <div class="top-actions"><a class="btn" href="/career-inbox.html">Career Inbox</a><a class="btn" href="/">← Command Center</a></div>
  </div>
  <section class="metrics" id="metrics"></section>
  <section class="grid">
    <article class="panel"><div class="eyebrow">PRIORIDADES</div><h2>O que merece atenção</h2><div class="rows" id="attention"></div></article>
    <article class="panel"><div class="eyebrow">INTERVIEW WAR ROOMS</div><h2>Preparação</h2><div class="rows" id="warrooms"></div></article>
    <article class="panel"><div class="eyebrow">JOB DISCOVERY</div><h2>Novas oportunidades</h2><div class="rows" id="discoveries"></div></article>
    <article class="panel"><div class="eyebrow">CALENDAR</div><h2>Entrevistas agendadas</h2><div id="calendar"></div></article>
  </section>
</main>
<script>
async function api(p,o){const r=await fetch(p,o),d=await r.json();if(!r.ok)throw new Error(d.error||'Falha');return d}
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function reconnectGoogle(){
  const button=document.getElementById('reconnect-google');
  if(button){button.disabled=true;button.textContent='Reconectando…'}
  try{
    await fetch('/api/oauth/gmail',{method:'DELETE'});
    window.location.assign('/api/oauth/gmail/connect');
  }catch(error){
    if(button){button.disabled=false;button.textContent='Reconectar Google'}
    alert(error instanceof Error?error.message:String(error));
  }
}
async function load(){
  const[brief,war,disc,cal]=await Promise.all([api('/api/career-intelligence/brief'),api('/api/career-intelligence/war-rooms'),api('/api/career-intelligence/discoveries'),api('/api/career-intelligence/calendar')]);
  document.getElementById('metrics').innerHTML=`<article class="metric"><span>PROCESSOS ATIVOS</span><strong>${brief.counts.active}</strong></article><article class="metric"><span>ENTREVISTAS</span><strong class="ok">${brief.counts.interviews}</strong></article><article class="metric"><span>FOLLOW-UPS</span><strong class="accent">${brief.counts.followUps}</strong></article><article class="metric"><span>PARADOS +7D</span><strong>${brief.counts.stale}</strong></article>`;
  const items=[...brief.interviews,...brief.followUps,...brief.attention,...brief.stale].filter((x,i,a)=>a.findIndex(y=>y.job.id===x.job.id)===i).slice(0,10);
  document.getElementById('attention').innerHTML=items.map(p=>`<div class="row"><strong>${esc(p.job.company)} — ${esc(p.job.role)}</strong><small>${esc(p.job.status)} · ${esc(p.suggestedAction||p.job.nextAction||'Revisar processo')}</small></div>`).join('')||'<p>Nenhuma prioridade crítica.</p>';
  document.getElementById('warrooms').innerHTML=war.items.slice(0,6).map(w=>`<div class="row"><strong>${esc(w.company)} — ${esc(w.role)}</strong><small>${esc(w.latestSignal||'Entrevista ativa')}</small><div>${w.preparation.slice(0,2).map(x=>`<small>• ${esc(x)}</small>`).join('<br>')}</div></div>`).join('')||'<p>Nenhuma entrevista ativa.</p>';
  document.getElementById('discoveries').innerHTML=disc.items.filter(x=>!x.duplicateJobId&&x.score>=65).slice(0,8).map(x=>`<div class="row"><strong>${esc(x.title)}</strong><small>Fit ${x.score}% · ${esc(x.signals.join(', '))}</small></div>`).join('')||'<p>Nenhuma descoberta prioritária.</p>';
  document.getElementById('calendar').innerHTML=cal.ready?(cal.items.map(x=>`<div class="row"><strong>${esc(x.title)}</strong><small>${new Date(x.start).toLocaleString('pt-BR')} ${x.warRoom?'· processo vinculado':''}</small></div>`).join('')||'<p>Sem entrevistas nos próximos 30 dias.</p>'):`<div class="auth-note"><p>Calendar ainda não autorizado. Depois de habilitar <code>calendar.readonly</code> no Google Cloud, renove a autorização do Google aqui.</p><button id="reconnect-google" onclick="reconnectGoogle()">Reconectar Google</button></div>`;
}
load();setInterval(load,60000);
</script>
</body>
</html>
