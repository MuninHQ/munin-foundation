<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Munin · Fluxos</title><link rel="stylesheet" href="/munin.css"><script defer src="/munin-nav.js"></script><style>
.grid{display:grid;grid-template-columns:300px 1fr;gap:16px}.trace{width:100%;text-align:left;border:1px solid var(--border);background:#09131d;color:var(--text);border-radius:10px;padding:12px;margin:6px 0;cursor:pointer}.trace.active{border-color:var(--accent-border);background:#0d2030}.trace span,.empty{display:block;color:var(--text-muted);font-size:11px;margin-top:4px}.flow{display:grid;gap:10px}.node{position:relative;border:1px solid var(--border-strong);border-radius:12px;background:#08141f;padding:14px 16px}.node+.node:before{content:'';position:absolute;height:11px;border-left:1px solid var(--accent-border);left:28px;top:-11px}.node small{color:var(--accent);letter-spacing:.12em}.node.ok{border-color:rgba(120,221,165,.35)}.node.fail{border-color:rgba(255,158,170,.45)}.attempts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:9px}.attempt{padding:9px;border-radius:8px;background:#050c13;font-size:11px}@media(max-width:760px){.grid{grid-template-columns:1fr}.trace-list{display:flex;overflow:auto;gap:8px}.trace{min-width:220px}}
</style></head><body><main class="munin-page"><header class="munin-page-header"><div class="munin-page-copy"><p class="eyebrow">N8N-INSPIRED · READ ONLY</p><h1>Fluxos operacionais</h1><p>Veja como cada objetivo foi roteado, quais providers tentaram executar e onde o fluxo concluiu ou falhou.</p></div><button class="trace" style="width:auto" onclick="load()">Atualizar</button></header><section class="grid"><aside class="munin-panel"><p class="eyebrow">EXECUÇÕES RECENTES</p><div id="traces" class="trace-list"></div></aside><article class="munin-panel"><p class="eyebrow">CAMINHO DA EXECUÇÃO</p><div id="flow" class="flow"><p class="empty">Selecione uma execução.</p></div></article></section></main><script>
let data=[],selected=0;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function draw(){traces.innerHTML=data.length?data.map((x,i)=>`<button class="trace ${i===selected?'active':''}" onclick="selected=${i};draw()"><b>${esc(x.planId)}</b><span>${esc(x.route)} · ${new Date(x.startedAt).toLocaleString()}</span></button>`).join(''):'<p class="empty">Nenhum trace nesta sessão. Novas orquestrações aparecerão aqui.</p>';const x=data[selected];if(!x){flow.innerHTML='<p class="empty">Execute um objetivo para visualizar o fluxo real.</p>';return}const attempts=(x.attempts||[]).map(a=>`<div class="attempt">${a.ok?'✓':'×'} ${esc(a.providerId)}${a.error?`<br>${esc(a.error)}`:''}</div>`).join('');flow.innerHTML=`<div class="node ok"><small>01 · PLANO</small><h3>${esc(x.planId)}</h3><span>Rota ${esc(x.route)}</span></div><div class="node"><small>02 · ROUTER</small><h3>${x.route==='council'?'Council + reviewer':'Execução direta'}</h3></div><div class="node ${x.attempts?.some(a=>a.ok)?'ok':'fail'}"><small>03 · EXECUÇÃO</small><h3>${esc(x.selectedProviderId||'Nenhum provider concluiu')}</h3><div class="attempts">${attempts||'<div class="attempt">Sem tentativas</div>'}</div></div><div class="node ${x.selectedProviderId?'ok':'fail'}"><small>04 · RESULTADO</small><h3>${x.selectedProviderId?'Concluído':'Falhou com segurança'}</h3><span>${new Date(x.completedAt).toLocaleString()}</span></div>`}async function load(){try{const r=await fetch('/api/orchestration/traces'),j=await r.json();if(!r.ok)throw new Error(j.error||'Falha');data=j.traces||[];selected=0;draw()}catch(e){flow.innerHTML=`<p class="empty">${esc(e.message)}</p>`}}load();
</script></body></html>
