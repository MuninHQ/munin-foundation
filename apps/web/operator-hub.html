<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Munin · Operator Hub</title><link rel="stylesheet" href="/munin.css"><script defer src="/munin-nav.js"></script><style>
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.metric,.card{border:1px solid var(--border);background:var(--surface);border-radius:13px;padding:15px}.metric strong{display:block;font-size:25px}.tabs{display:flex;gap:6px;overflow:auto;margin:18px 0 12px}.tabs button{border:1px solid var(--border-strong);background:transparent;color:var(--text-muted);border-radius:999px;padding:9px 12px;white-space:nowrap}.tabs button.active{background:#123047;color:var(--text)}.panel{display:none}.panel.active{display:grid;gap:10px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.item h3{margin:0 0 5px;font-size:14px}.item p,.muted{margin:0;color:var(--text-muted);font-size:11px}.tag{font-size:9px;letter-spacing:.1em;color:var(--accent);border:1px solid var(--accent-border);border-radius:999px;padding:4px 7px}.item a{text-decoration:none;color:var(--accent-bright)}.steps{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.steps span{font-size:10px;background:#071019;padding:6px 8px;border-radius:7px}.brief{line-height:1.55}.calendar{border-color:rgba(232,196,107,.3)}@media(max-width:760px){.metrics{grid-template-columns:repeat(2,1fr)}.item{grid-template-columns:1fr}.munin-page{padding-bottom:80px}}
</style></head><body><main class="munin-page"><header class="munin-page-header"><div class="munin-page-copy"><p class="eyebrow">PROACTIVE OPERATING SYSTEM</p><h1>Today</h1><p>Follow-ups, agenda, pessoas, aprovações e desempenho operacional numa única visão.</p></div><button class="tag" onclick="load()">ATUALIZAR</button></header><section id="metrics" class="metrics"></section><nav class="tabs" id="tabs"></nav><section id="content"></section></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data,active='today';const names={today:'Hoje',waitingFor:'Waiting For',approvals:'Approvals',people:'Pessoas',browserPlans:'Browser Plans',briefs:'Briefs',analytics:'Analytics'};function item(x){return `<article class="card item"><div><span class="tag">${esc(x.priority||x.kind||x.status||'ITEM')}</span><h3>${esc(x.title||x.name||x.objective)}</h3><p>${esc(x.detail||x.impact||`${x.role||''} ${x.company||''}`)}</p>${x.steps?`<div class="steps">${x.steps.map(s=>`<span>${esc(s)}</span>`).join('')}</div>`:''}</div>${x.href?`<a href="${esc(x.href)}">Abrir →</a>`:''}</article>`}function draw(){metrics.innerHTML=[['Hoje',data.today.length],['Waiting',data.waitingFor.length],['Approvals',data.approvals.length],['Pessoas',data.people.length],['Success',`${data.analytics.successRate}%`]].map(x=>`<article class="metric"><span class="eyebrow">${x[0]}</span><strong>${x[1]}</strong></article>`).join('');tabs.innerHTML=Object.entries(names).map(([k,v])=>`<button class="${k===active?'active':''}" onclick="active='${k}';draw()">${v}</button>`).join('');let body;if(active==='briefs')body=[data.briefs.morning,data.briefs.evening].map(b=>`<article class="card brief"><span class="eyebrow">${esc(b.title)}</span><h2>${esc(b.headline)}</h2>${b.items.map(item).join('')}</article>`).join('');else if(active==='analytics')body=`<article class="card"><h2>Agent Session Analytics</h2><p class="muted">${data.analytics.runs} runs · ${data.analytics.attempts} tentativas · ${data.analytics.engineeringCompleted} jobs concluídos · ${data.analytics.engineeringFailed} falhos</p></article><article class="card calendar"><h3>Calendário · ${esc(data.calendar.mode)}</h3><p class="muted">${esc(data.calendar.reason)}</p></article>`;else{const rows=data[active]||[];body=rows.length?rows.map(item).join(''):'<article class="card muted">Nada pendente nesta área.</article>'}content.innerHTML=`<div class="panel active">${body}</div>`}async function load(){const r=await fetch('/api/proactive-operator'),j=await r.json();if(!r.ok){content.innerHTML=`<article class="card">${esc(j.error||'Falha')}</article>`;return}data=j;draw()}load();
</script></body></html>
