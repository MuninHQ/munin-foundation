<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Munin Email Intelligence</title>
  <link rel="stylesheet" href="/munin.css" />
  <style>
    .shell{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.panel,.card{border:1px solid #193149;background:#08131f;border-radius:14px;padding:18px}.list{display:grid;gap:10px}.card{background:#071725}.muted{color:var(--text-muted)}.num{font-size:24px}.tag{display:inline-block;border:1px solid #2d607e;color:#7acbfa;padding:4px 8px;border-radius:20px;font-size:10px;margin-right:5px}button,a{border:1px solid #28506c;background:#0d1d2b;color:#d8ecfa;border-radius:9px;padding:10px 13px;text-decoration:none;cursor:pointer}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}.shell{padding:16px}}
  </style>
  <script defer src="/munin-nav.js"></script>
</head>
<body>
<main class="shell">
  <div class="top"><div><div class="eyebrow">READ-ONLY · LOCAL INTELLIGENCE</div><h1>Email Intelligence</h1><p class="muted">Ações, revisão e leituras relevantes sem enviar e-mail nem usar IA paga.</p></div><div><a href="/">← Command Center</a> <button onclick="load()">Atualizar</button></div></div>
  <section id="stats" class="grid" style="margin:18px 0"></section>
  <section class="panel"><div class="eyebrow">ACTION QUEUE</div><h2>Precisa de ação</h2><div id="actions" class="list"></div></section>
  <section class="panel" style="margin-top:16px"><div class="eyebrow">WORTH READING</div><h2>Vale a leitura</h2><div id="reads" class="list"></div></section>
</main>
<script>
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'})[c])}
async function load(){const r=await fetch('/api/email-intelligence');const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha');const s=d.snapshot;if(!s){stats.innerHTML='<div class="panel">Aguardando primeiro sync.</div>';actions.innerHTML=reads.innerHTML='';return}stats.innerHTML=[['AÇÕES',s.unreadActionable],['CARREIRA',s.careerActionable],['GERAL',s.generalActionable],['VALE LER',s.interestingReads]].map(x=>`<div class="panel"><div class="eyebrow">${x[0]}</div><div class="num">${x[1]}</div></div>`).join('');actions.innerHTML=s.topActions.length?s.topActions.map(x=>`<div class="card"><span class="tag">${esc(x.attention)}</span><h3>${esc(x.subject)}</h3><p>${esc(x.from||'')}</p><p class="muted">${esc(x.reason||'Ação detectada')}</p></div>`).join(''):'<p class="muted">Nenhuma ação pendente detectada.</p>';reads.innerHTML=s.topReads.length?s.topReads.map(x=>`<div class="card"><span class="tag">score ${x.score}</span><h3>${esc(x.subject)}</h3><p>${esc(x.from||'')}</p><p class="muted">${esc(x.reasons.join(' · '))}</p></div>`).join(''):'<p class="muted">Nenhuma leitura relevante detectada.</p>'}
load().catch(e=>{document.body.insertAdjacentHTML('beforeend',`<div class="panel">${esc(e.message)}</div>`)});
</script>
</body></html>
