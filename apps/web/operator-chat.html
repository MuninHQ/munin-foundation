<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Munin · Chat Operacional</title><link rel="stylesheet" href="/munin.css"><script defer src="/munin-nav.js"></script><style>
.chat-shell{max-width:920px;margin:auto}.chat{min-height:55vh;max-height:65vh;overflow:auto;display:grid;align-content:start;gap:10px}.bubble{max-width:82%;padding:12px 14px;border-radius:13px;white-space:pre-wrap;line-height:1.5;font-size:13px}.user{justify-self:end;background:#13334a}.assistant{justify-self:start;background:#0a1722;border:1px solid var(--border)}.composer{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:12px}.composer textarea{min-height:58px;resize:vertical}.send{border:1px solid var(--accent-border);background:var(--accent-strong);color:white;border-radius:10px;padding:0 18px}.quick{display:flex;gap:7px;overflow:auto;margin:0 0 12px}.quick button{white-space:nowrap;border:1px solid var(--border-strong);background:transparent;color:var(--text-soft);border-radius:999px;padding:8px 10px;font-size:11px}.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.meta span{color:var(--text-muted);font-size:11px}@media(max-width:640px){.chat{min-height:58vh;max-height:62vh}.bubble{max-width:92%}.composer{grid-template-columns:1fr}.send{padding:13px}}
</style></head><body><main class="munin-page chat-shell"><header class="munin-page-header"><div class="munin-page-copy"><p class="eyebrow">LOCAL COMMANDS + CHATGPT COCKPIT</p><h1>Chat operacional</h1><p>Comandos determinísticos ficam no Munin. Raciocínio livre continua no ChatGPT usando somente um snapshot sanitizado.</p></div></header><section class="munin-panel"><div class="meta"><span>LOCAL · SEM OLLAMA · SEM API PAGA</span><button onclick="clearHistory()">Limpar conversa</button></div><div class="quick"><button onclick="ask('SITREP')">SITREP</button><button onclick="ask('NEXT')">Próxima ação</button><button onclick="ask('Liste projetos ativos')">Projetos ativos</button><button onclick="ask('Mostre vagas em entrevista')">Vagas em entrevista</button></div><div id="chat" class="chat"></div><form class="composer" onsubmit="send(event)"><textarea id="command" class="munin-input" placeholder="Digite um comando do Munin…" required></textarea><button id="sendButton" class="send">Enviar</button></form></section></main><script type="module" src="/src/chatgpt-operator-bridge.ts"></script><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function bubble(text,role){chat.insertAdjacentHTML('beforeend',`<div class="bubble ${role==='user'?'user':'assistant'}">${esc(text)}</div>`);chat.scrollTop=chat.scrollHeight}async function history(){try{const r=await fetch('/api/assistant/history'),d=await r.json();chat.innerHTML='';(d.turns||[]).slice(-30).forEach(x=>bubble(x.text,x.role));if(!d.turns?.length)bubble('Pronto. Posso executar operações locais, consultar contexto e preparar o handoff seguro para o ChatGPT.','assistant')}catch{bubble('Não foi possível carregar o histórico local.','assistant')}}async function ask(value){command.value=value;await submit()}async function send(e){e.preventDefault();await submit()}async function submit(){const value=command.value.trim();if(!value)return;bubble(value,'user');command.value='';sendButton.disabled=true;try{const r=await fetch('/api/assistant',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({command:value})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Falha');bubble(d.message,'assistant')}catch(e){bubble(e.message,'assistant')}finally{sendButton.disabled=false;command.focus()}}async function clearHistory(){await fetch('/api/assistant/history',{method:'DELETE'});chat.innerHTML='';bubble('Conversa local limpa.','assistant')}history();
</script></body></html>
