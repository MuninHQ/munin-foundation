<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Munin · Chat Operacional</title><link rel="stylesheet" href="/munin.css"><script defer src="/munin-nav.js"></script><style>
.chat-shell{max-width:920px;margin:auto}.chat{min-height:55vh;max-height:65vh;overflow:auto;display:grid;align-content:start;gap:10px}.bubble{max-width:82%;padding:12px 14px;border-radius:13px;white-space:pre-wrap;line-height:1.5;font-size:13px}.user{justify-self:end;background:#13334a}.assistant{justify-self:start;background:#0a1722;border:1px solid var(--border)}.composer{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:12px}.composer textarea{min-height:58px;resize:vertical}.send{border:1px solid var(--accent-border);background:var(--accent-strong);color:white;border-radius:10px;padding:0 18px}.quick{display:flex;gap:7px;overflow:auto;margin:0 0 12px}.quick button{white-space:nowrap;border:1px solid var(--border-strong);background:transparent;color:var(--text-soft);border-radius:999px;padding:8px 10px;font-size:12px}.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.meta span{color:var(--text-muted);font-size:12px}.mode{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}.mode-switch{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--radius-sm);padding:2px}.mode-switch label{cursor:pointer;font-size:12px;padding:6px 12px;border-radius:5px;color:var(--text-muted)}.mode-switch input{position:absolute;opacity:0;pointer-events:none}.mode-switch input:checked+span{color:var(--text)}.mode-switch label:has(input:checked){background:var(--surface-raised);box-shadow:inset 0 0 0 1px var(--accent-border)}.mode-switch label:has(input:focus-visible){outline:2px solid var(--accent-bright);outline-offset:2px}.mode-hint{color:var(--text-muted);font-size:12px}.proposal{border-color:var(--accent-border)}.proposal-actions{display:flex;gap:8px;margin-top:10px}.proposal-actions button{font-size:12px;padding:7px 12px;border-radius:var(--radius-sm);border:1px solid var(--border-strong);background:transparent;color:var(--text-soft);cursor:pointer}.proposal-actions .run{border-color:var(--accent-border);background:var(--accent-strong);color:#fff}.proposal-state{display:block;margin-top:8px;color:var(--text-muted);font-size:12px}.blocked{border-color:rgba(232,196,107,.42)}.undo{display:block;margin-top:8px;color:var(--text-muted);font-size:12px}.suggestions{display:grid;gap:6px;margin-top:10px}.suggestions button{text-align:left;font-size:13px;padding:9px 11px;border-radius:var(--radius-sm);border:1px solid var(--border);background:transparent;color:var(--text-soft);cursor:pointer}.suggestions button:hover{border-color:var(--accent-border);color:var(--text)}@media(max-width:640px){.chat{min-height:58vh;max-height:62vh}.bubble{max-width:92%}.composer{grid-template-columns:1fr}.send{padding:13px}}
</style><link rel="stylesheet" href="/munin-workspace.css" /><script src="/munin-presence.js"></script><script defer src="/munin-workspace.js"></script><link rel="icon" href="/brand/munin-raven-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/brand/apple-touch-icon.png"></head><body><main class="munin-page chat-shell"><header class="munin-page-header"><div class="munin-page-copy"><p class="eyebrow">LOCAL COMMANDS + CLAUDE</p><h1>Chat operacional</h1><p>Comandos determinísticos ficam no Munin. Perguntas livres são respondidas pelo Claude neste PC, sem API paga e usando somente um snapshot sanitizado.</p></div></header><section class="munin-panel"><div class="meta"><span>LOCAL · SEM OLLAMA · SEM API PAGA</span><button onclick="clearHistory()">Limpar conversa</button></div><div class="quick"><button onclick="ask('SITREP')">SITREP</button><button onclick="ask('NEXT')">Próxima ação</button><button onclick="ask('Liste projetos ativos')">Projetos ativos</button><button onclick="ask('Mostre vagas em entrevista')">Vagas em entrevista</button></div><div id="chat" class="chat"></div><div class="mode"><div class="mode-switch" role="radiogroup" aria-label="Modo do chat"><label><input type="radio" name="mode" value="plan" checked><span>Planejar</span></label><label><input type="radio" name="mode" value="execute"><span>Executar</span></label></div><span id="modeHint" class="mode-hint" aria-live="polite"></span></div><form class="composer" onsubmit="send(event)"><textarea id="command" class="munin-input" placeholder="Digite um comando do Munin…" required></textarea><button id="sendButton" class="send">Enviar</button></form></section></main><script type="module" src="/src/claude-operator-bridge.ts"></script><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SUGGESTIONS=['O que precisa da minha atenção hoje?','SITREP','Liste projetos ativos','Mostre vagas em entrevista','criar ação: revisar prioridades da semana'];
const MODE_HINTS={plan:'Planejar: o Munin lê e propõe — nada é alterado até você executar.',execute:'Executar: comandos locais são aplicados direto. Ações externas continuam pedindo aprovação.'};
const mode=()=>document.querySelector('input[name="mode"]:checked').value;
const syncMode=()=>{modeHint.textContent=MODE_HINTS[mode()]};
document.querySelectorAll('input[name="mode"]').forEach(x=>x.addEventListener('change',syncMode));syncMode();
let pending=[];
function bubble(text,role,extra=''){chat.insertAdjacentHTML('beforeend',`<div class="bubble ${role==='user'?'user':'assistant'} ${extra}">${esc(text)}</div>`);chat.scrollTop=chat.scrollHeight;return chat.lastElementChild}
function emptyState(){const node=bubble('Pronto. Posso executar operações locais, consultar contexto e responder perguntas livres com o Claude e preparar o handoff seguro para o claude.ai. Experimente:','assistant');node.insertAdjacentHTML('beforeend',`<div class="suggestions">${SUGGESTIONS.map(x=>`<button type="button" data-ask="${esc(x)}">${esc(x)}</button>`).join('')}</div>`);node.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>ask(b.dataset.ask))}
function settle(card,label){card.querySelector('.proposal-actions')?.remove();card.insertAdjacentHTML('beforeend',`<span class="proposal-state">${esc(label)}</span>`);pending=pending.filter(x=>x!==card)}
function render(d){
 if(d.kind==='proposal'&&d.proposal){const card=bubble(d.message,'assistant','proposal');card.insertAdjacentHTML('beforeend','<div class="proposal-actions"><button type="button" class="run">Executar</button><button type="button" class="discard">Descartar</button></div>');card.querySelector('.run').onclick=()=>run(card,d.proposal.command);card.querySelector('.discard').onclick=()=>settle(card,'Descartada.');pending.push(card);return}
 const node=bubble(d.interpretedBy==='claude'?`✦ Claude\n${d.message}`:d.message,'assistant',d.kind==='blocked'?'blocked':'');
 if(d.undo)node.insertAdjacentHTML('beforeend',`<span class="undo">↩ ${esc(d.undo)}</span>`);
}
async function post(command,chosen){const r=await fetch('/api/assistant',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({command,mode:chosen})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Falha');return d}
async function run(card,command){card.querySelectorAll('.proposal-actions button').forEach(b=>b.disabled=true);try{const d=await post(command,'execute');settle(card,'Executada.');render(d)}catch(e){card.querySelectorAll('.proposal-actions button').forEach(b=>b.disabled=false);bubble(e.message,'assistant')}}
async function history(){try{const r=await fetch('/api/assistant/history'),d=await r.json();chat.innerHTML='';(d.turns||[]).slice(-30).forEach(x=>bubble(x.text,x.role));if(!d.turns?.length)emptyState()}catch{bubble('Não foi possível carregar o histórico local.','assistant')}}
async function ask(value){command.value=value;await submit()}async function send(e){e.preventDefault();await submit()}
async function submit(){const value=command.value.trim();if(!value)return;
 // A new message never approves a pending proposal: it discards it, visibly.
 pending.slice().forEach(card=>settle(card,'Descartada — nova mensagem enviada.'));
 bubble(value,'user');command.value='';sendButton.disabled=true;try{render(await post(value,mode()))}catch(e){bubble(e.message,'assistant')}finally{sendButton.disabled=false;command.focus()}}
async function clearHistory(){await fetch('/api/assistant/history',{method:'DELETE'});chat.innerHTML='';pending=[];emptyState()}history();
</script></body></html>
