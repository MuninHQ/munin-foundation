<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Munin Radar</title><link rel="stylesheet" href="/munin.css"><script defer src="/munin-nav.js"></script><style>
.shell{max-width:1200px;margin:auto;padding:28px 20px 90px}.top,.source,.signal{display:flex;justify-content:space-between;gap:14px;align-items:center}.top{align-items:flex-start}.grid{display:grid;grid-template-columns:1fr 1.8fr;gap:16px;margin-top:20px}.panel{border:1px solid var(--border);background:var(--panel);border-radius:14px;padding:18px}.source,.signal{border-top:1px solid #173047;padding:13px 0}.source:first-child,.signal:first-child{border-top:0}.ok{color:#65d6a2}.bad{color:#ff9b91}.signal{align-items:flex-start}.signal h3{font-size:15px;margin:3px 0}.signal a{text-decoration:none}.tag{display:inline-block;border:1px solid #28506c;border-radius:999px;padding:3px 7px;margin:2px;font-size:10px}.refresh{border:1px solid #28506c;background:#0d1d2b;color:#d8ecfa;border-radius:9px;padding:10px 13px}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{flex-direction:column}}
</style></head><body><main class="shell"><section class="top"><div><p class="eyebrow">TRUSTED SOURCE INTELLIGENCE</p><h1>Munin Radar</h1><p class="muted">Mudanças regulatórias e sinais relevantes, com origem e saúde verificáveis.</p></div><button class="refresh" onclick="load(true)">Verificar agora</button></section><section class="grid"><article class="panel"><p class="eyebrow">CONNECTOR REGISTRY</p><h2>Fontes</h2><div id="sources">Carregando…</div></article><article class="panel"><p class="eyebrow">NOVOS SINAIS</p><h2>Radar</h2><div id="signals">Carregando…</div></article></section></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(refresh=false){try{const [rr,cr]=await Promise.all([fetch('/api/radar'+(refresh?'?refresh=1':'')),fetch('/api/connectors')]);const r=await rr.json(),c=await cr.json();if(!rr.ok)throw new Error(r.error||'Falha no Radar');sources.innerHTML=c.items.map(x=>`<div class="source"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.detail)}</div></div><span class="${x.health==='healthy'?'ok':'bad'}">${esc(x.health)}</span></div>`).join('');signals.innerHTML=r.signals.length?r.signals.map(x=>`<div class="signal"><div><span class="eyebrow">${esc(x.sourceName)} · relevância ${x.relevance}</span><h3><a href="${esc(x.url)}" target="_blank" rel="noreferrer">${esc(x.title)}</a></h3><div>${x.themes.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div></div><span class="muted">${x.freshnessDays??'—'}d</span></div>`).join(''):'<p class="muted">Nenhum sinal válido no momento.</p>'}catch(e){signals.textContent=e.message}}load();
</script></body></html>
