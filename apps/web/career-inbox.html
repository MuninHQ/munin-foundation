<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Munin Career Inbox</title><style>:root{font-family:Inter,system-ui;color:#eef6ff;background:#050b13}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#12385a55,transparent 34%),#050b13;min-height:100vh}.shell{max-width:1400px;margin:auto;padding:32px}.top,.toolbar,.provider{display:flex;justify-content:space-between;align-items:center}.eyebrow{color:#4ba6df;font-size:11px;letter-spacing:.18em;font-weight:700}h1{margin:6px 0;font-size:34px}p{color:#7e94a8}.buttons,.filters{display:flex;gap:10px;flex-wrap:wrap}button,a.btn{border:1px solid #28506c;background:#0d1d2b;color:#d8ecfa;border-radius:9px;padding:11px 14px;text-decoration:none;cursor:pointer}button.primary{background:#126a9f;color:white}.connections{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:16px}.panel,.message{border:1px solid #193149;background:#08131f;border-radius:13px;padding:20px}.capture{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}.drop{border:1px dashed #34769e;min-height:180px;display:flex;align-items:center;justify-content:center;text-align:center;transition:.2s}.drop.over{background:#0d2638;border-color:#67c7ff}.paste textarea{width:100%;height:110px;background:#06101a;color:#e8f5ff;border:1px solid #203b50;border-radius:8px;padding:12px;resize:vertical}.paste .buttons{margin-top:10px}.status{font-size:11px;padding:5px 9px;border-radius:20px;background:#321d22;color:#ff9eaa}.status.on{background:#123222;color:#78dda5}.toolbar{margin:24px 0 14px}.filters button.active{background:#15364e}.list{display:grid;gap:12px}.message{display:grid;grid-template-columns:1fr auto;gap:18px}.meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;font-size:11px;color:#7790a5}.tag{border:1px solid #285a78;border-radius:20px;padding:4px 8px;color:#72c6f5}.confidence{color:#8adcb0}.subject{font-size:17px;margin:10px 0 5px}.snippet{font-size:13px;line-height:1.5}.link{margin-top:12px;color:#9fc9e5;font-size:12px}.actions{display:flex;flex-direction:column;gap:8px;min-width:170px}.empty{text-align:center;padding:50px}.notice{position:fixed;right:25px;top:25px;background:#0f2b20;border:1px solid #39795a;padding:12px 16px;border-radius:9px;z-index:10}.hint{font-size:12px;color:#6e879a}@media(max-width:800px){.shell{padding:18px}.top,.toolbar{align-items:flex-start;flex-direction:column;gap:14px}.connections,.capture{grid-template-columns:1fr}.message{grid-template-columns:1fr}.actions{flex-direction:row;min-width:0}}</style></head><body><main class="shell"><div class="top"><div><div class="eyebrow">MUNIN CAREER OPERATIONS</div><h1>Career Inbox</h1><p>Capture por arquivo, texto colado, Gmail ou Outlook.</p></div><div class="buttons"><a class="btn" href="/">← Command Center</a><button class="primary" onclick="syncNow()">Sincronizar contas</button></div></div><section class="connections" id="connections"></section><section class="capture"><article class="panel drop" id="drop"><div><div class="eyebrow">CAPTURA RÁPIDA</div><h2>Arraste um e-mail aqui</h2><p>.eml ou .txt · máximo 5 MB</p><input id="file" type="file" accept=".eml,.txt,.msg" hidden/><button onclick="document.getElementById('file').click()">Escolher arquivo</button><p class="hint">Para .msg, salve como .eml no Outlook.</p></div></article><article class="panel paste"><div class="eyebrow">CLIPBOARD INTELLIGENCE</div><h2>Colar mensagem</h2><textarea id="captureText" placeholder="Cole aqui o assunto e o conteúdo do e-mail..."></textarea><div class="buttons"><button class="primary" onclick="captureText()">Analisar e importar</button><button onclick="document.getElementById('captureText').value=''">Limpar</button></div></article></section><div class="toolbar"><div><div class="eyebrow">REVISÃO</div><h2>Mensagens de carreira</h2></div><div class="filters"><button class="active" onclick="setFilter('pending',this)">Pendentes</button><button onclick="setFilter('all',this)">Todas</button></div></div><section class="list" id="messages"></section></main><script>let data={messages:[],connections:[]},filter='pending';const labels={application_confirmation:'Candidatura confirmada',interview_invite:'Convite para entrevista',recruiter_reply:'Retorno de recrutador',information_request:'Pedido de informações',rejection:'Rejeição',offer:'Oferta',assessment:'Teste / assessment',job_alert:'Alerta de vagas',other:'Outro'};async function api(path,options){const r=await fetch(path,{headers:{'content-type':'application/json'},...options});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha');return d}function toast(t){const n=document.createElement('div');n.className='notice';n.textContent=t;document.body.appendChild(n);setTimeout(()=>n.remove(),3500)}async function load(){try{data=await api('/api/career-inbox');render()}catch(e){toast(e.message)}}function render(){document.getElementById('connections').innerHTML=data.connections.map(c=>`<article class="panel provider"><div><strong>${c.provider==='gmail'?'Gmail':'Outlook / Hotmail'}</strong><p>${c.configured?(c.connected?'Conta conectada':'Pronto para conectar'):'OAuth opcional não configurado'}</p></div><div class="buttons"><span class="status ${c.connected?'on':''}">${c.connected?'CONECTADO':'OPCIONAL'}</span>${c.connected?`<button onclick="disconnect('${c.provider}')">Desconectar</button>`:c.configured?`<a class="btn" href="http://127.0.0.1:4310/api/oauth/${c.provider}/connect">Conectar</a>`:''}</div></article>`).join('');const rows=data.messages.filter(m=>filter==='all'||!m.handled);document.getElementById('messages').innerHTML=rows.length?rows.map(m=>`<article class="message"><div><div class="meta"><span class="tag">${labels[m.category]||m.category}</span><span>${m.provider==='capture'?'captura local':m.provider}</span><span>${new Date(m.receivedAt).toLocaleString()}</span><span class="confidence">${Math.round(m.confidence*100)}% confiança</span></div><div class="subject">${esc(m.subject)}</div><div class="snippet">${esc(m.snippet||'')}</div><div class="link">${m.detectedCompany?`${esc(m.detectedCompany)} — ${esc(m.detectedRole||'')}`:'Sem vaga vinculada'}${m.suggestedAction?` · ${esc(m.suggestedAction)}`:''}</div></div><div class="actions">${m.linkedJobId&&m.suggestedStatus&&!m.handled?`<button class="primary" onclick="applyMsg('${m.id}')">Confirmar atualização</button>`:''}${!m.handled?`<button onclick="ignoreMsg('${m.id}')">Ignorar</button>`:'<span class="status on">REVISADO</span>'}</div></article>`).join(''):'<article class="panel empty"><h3>Nenhuma mensagem nesta visão</h3><p>Arraste um .eml ou cole uma mensagem para começar.</p></article>'}function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function setFilter(v,b){filter=v;document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}async function capture(format,filename,content){try{const r=await api('/api/career-inbox/capture',{method:'POST',body:JSON.stringify({format,filename,content})});toast(r.added?'Mensagem importada e classificada':'Mensagem já importada');await load()}catch(e){toast(e.message)}}async function captureText(){const el=document.getElementById('captureText');if(!el.value.trim())return toast('Cole uma mensagem primeiro');await capture('text','clipboard.txt',el.value);el.value=''}async function handleFile(file){const ext=file.name.split('.').pop().toLowerCase();if(!['eml','txt','msg'].includes(ext))return toast('Use .eml, .txt ou texto colado');if(file.size>5_000_000)return toast('Arquivo maior que 5 MB');const content=ext==='msg'?'arquivo-binario-msg':await file.text();await capture(ext,file.name,content)}async function syncNow(){try{const r=await api('/api/career-inbox/sync',{method:'POST'});toast(`${r.added} novas mensagens`);await load()}catch(e){toast(e.message)}}async function applyMsg(id){try{await api(`/api/career-inbox/${id}/apply`,{method:'POST'});toast('Pipeline atualizado');await load()}catch(e){toast(e.message)}}async function ignoreMsg(id){await api(`/api/career-inbox/${id}/ignore`,{method:'POST'});await load()}async function disconnect(p){await api(`/api/oauth/${p}`,{method:'DELETE'});await load()}const drop=document.getElementById('drop'),file=document.getElementById('file');file.addEventListener('change',()=>file.files[0]&&handleFile(file.files[0]));['dragenter','dragover'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.add('over')}));['dragleave','drop'].forEach(e=>drop.addEventListener(e,x=>{x.preventDefault();drop.classList.remove('over')}));drop.addEventListener('drop',e=>e.dataTransfer.files[0]&&handleFile(e.dataTransfer.files[0]));load();</script></body></html>
