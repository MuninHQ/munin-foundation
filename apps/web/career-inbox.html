<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Munin Career Inbox</title><link rel="stylesheet" href="/munin.css"/><style>
.shell{max-width:1400px;margin:auto;padding:32px}.top,.toolbar{display:flex;justify-content:space-between;align-items:center}p{color:var(--text-muted)}.buttons,.filters{display:flex;gap:10px;flex-wrap:wrap}button,a.btn{border:1px solid #28506c;background:#0d1d2b;color:#d8ecfa;border-radius:9px;padding:11px 14px;text-decoration:none;cursor:pointer}button.primary{background:var(--accent-strong);color:white}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0}.panel,.message,.metric{border:1px solid #193149;background:#08131f;border-radius:13px;padding:20px}.metric strong{font-size:28px;display:block;margin-top:8px}.metric.attention strong{color:#72c6f5}.metric.interview strong{color:#8adcb0}.toolbar{margin:24px 0 14px}.filters button.active{background:#15364e}.list{display:grid;gap:12px}.message{display:grid;grid-template-columns:1fr auto;gap:18px}.message.noise{opacity:.6}.meta{display:flex;gap:9px;flex-wrap:wrap;font-size:11px;color:var(--text-muted)}.tag{border:1px solid #285a78;border-radius:20px;padding:4px 8px;color:#72c6f5}.subject{font-size:17px;margin:10px 0 5px}.snippet,.link{font-size:13px;color:var(--text-muted)}.actions{display:flex;flex-direction:column;gap:8px;min-width:150px}.empty{text-align:center;padding:50px}@media(max-width:800px){.shell{padding:18px}.metrics{grid-template-columns:1fr 1fr}.top,.toolbar{align-items:flex-start;flex-direction:column;gap:14px}.message{grid-template-columns:1fr}}
</style><script defer src="/munin-nav.js"></script></head><body><main class="shell"><div class="top"><div><div class="eyebrow">MUNIN EMAIL + CAREER INTELLIGENCE</div><h1>Unified Inbox</h1><p>Carreira e ações pendentes importantes primeiro. Ruído operacional fica fora da fila diária.</p></div><div class="buttons"><a class="btn" href="/">← Command Center</a><button class="primary" onclick="syncNow()">Sincronizar emails</button></div></div><section class="metrics" id="metrics"></section><div class="toolbar"><div><div class="eyebrow">INTELLIGENCE SIGNALS</div><h2>Fila inteligente</h2></div><div class="filters"><button class="active" onclick="setFilter('attention',this)">Precisa de ação</button><button onclick="setFilter('interviews',this)">Entrevistas</button><button onclick="setFilter('applications',this)">Candidaturas</button><button onclick="setFilter('closed',this)">Encerradas</button><button onclick="setFilter('noise',this)">Ruído</button><button onclick="setFilter('all',this)">Todas</button></div></div><section class="list" id="messages"></section></main><script>
let data={messages:[]},filter='attention';const labels={application_confirmation:'Candidatura confirmada',interview_invite:'Convite para entrevista',recruiter_reply:'Retorno de recrutador',information_request:'Pedido de informações',rejection:'Rejeição',offer:'Oferta',assessment:'Teste / assessment',job_alert:'Alerta de vagas',other:'Outro'};const actionable=new Set(['interview_invite','recruiter_reply','information_request','offer','assessment']);async function api(path,options){const r=await fetch(path,{headers:{'content-type':'application/json'},...options});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha');return d}function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function bucket(m){if(m.needsAction||m.attention==='general_action')return'attention';if(m.category==='other'||m.category==='job_alert')return'noise';if(m.category==='rejection')return'closed';if(m.category==='interview_invite'||m.category==='assessment')return'interviews';if(m.category==='application_confirmation')return'applications';return!m.handled&&actionable.has(m.category)?'attention':'attention'}function visible(m){if(filter==='all')return true;if(filter==='attention')return!m.handled&&bucket(m)!=='noise'&&bucket(m)!=='closed';return bucket(m)===filter}async function load(){data=await api('/api/career-inbox');render()}function render(){const c={attention:0,interviews:0,applications:0,noise:0};data.messages.forEach(m=>{const b=bucket(m);if(b in c)c[b]++;if(!m.handled&&b!=='attention'&&b!=='noise'&&b!=='closed')c.attention++});document.getElementById('metrics').innerHTML=`<article class="metric attention"><span>PRECISA DE AÇÃO</span><strong>${c.attention}</strong></article><article class="metric interview"><span>ENTREVISTAS</span><strong>${c.interviews}</strong></article><article class="metric"><span>CANDIDATURAS</span><strong>${c.applications}</strong></article><article class="metric"><span>RUÍDO FILTRADO</span><strong>${c.noise}</strong></article>`;const rows=data.messages.filter(visible);document.getElementById('messages').innerHTML=rows.length?rows.map(m=>`<article class="message ${bucket(m)==='noise'?'noise':''}"><div><div class="meta"><span class="tag">${m.attention==='general_action'?'AÇÃO PENDENTE':labels[m.category]||m.category}</span><span>${esc(m.provider)}</span><span>${new Date(m.receivedAt).toLocaleString()}</span><span>${Math.round(m.confidence*100)}%</span></div><div class="subject">${esc(m.subject)}</div><div class="snippet">${esc(m.snippet)}</div><div class="link">${m.detectedCompany?`${esc(m.detectedCompany)} — ${esc(m.detectedRole)}`:'Sem oportunidade vinculada'}${m.actionReason?` · ${esc(m.actionReason)}`:m.suggestedAction?` · ${esc(m.suggestedAction)}`:''}</div></div><div class="actions">${m.attention==='general_action'&&m.needsAction&&!m.handled?`<button class="primary" onclick="promoteAction('${m.id}')">Criar ação</button>`:''}${m.linkedJobId&&m.suggestedStatus&&!m.handled?`<button class="primary" onclick="applyMsg('${m.id}')">Aplicar estágio</button>`:''}${!m.handled&&bucket(m)!=='noise'?`<button onclick="ignoreMsg('${m.id}')">Arquivar</button>`:'<span>FILTRADO</span>'}</div></article>`).join(''):'<article class="panel empty"><h3>Nada exige sua atenção</h3><p>O Munin separou o ruído e consolidou sinais de carreira e ações gerais.</p></article>'}function setFilter(v,b){filter=v;document.querySelectorAll('.filters button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}async function applyMsg(id){await api(`/api/career-inbox/${id}/apply`,{method:'POST'});await load()}async function promoteAction(id){const m=data.messages.find(x=>x.id===id);if(!m)return;const reason=m.actionReason?` — ${m.actionReason}`:'';await api('/api/actions',{method:'POST',body:JSON.stringify({title:`Email: ${m.subject}${reason}`,priority:'P1'})});await api(`/api/career-inbox/${id}/ignore`,{method:'POST'});await load()}async function ignoreMsg(id){await api(`/api/career-inbox/${id}/ignore`,{method:'POST'});await load()}async function syncNow(){await api('/api/career-inbox/sync',{method:'POST',body:'{}'});await load()}load();setInterval(load,30000);
</script></body></html>
